name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          # Throwaway container: trust auth means no credential is stored anywhere.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: movies_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Test-harness variable read only by the DB integration tests; DB_DSN is deliberately unset.
      TEST_DB_DSN: postgresql+psycopg2://postgres@localhost:5432/movies_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Syntax check
        run: python -m compileall -q backend tests
      - name: Run tests
        run: python -m pytest -q
